id: ucs_gaab_gwslog_stats
type: cloud-ml-metadata-test-jialu.us-central1.simple-entry-type
resource:
  name: projects/concord-prod/datasets/analysis_userlevel/tables/ucs_gaab_gwslog_stats
  displayName: "ucs_gaab_gwslog_stats"
  description: "Aggregated statistics for Google Web Server (GWS) logs at the user level."
  labels:
    tier: "tier1"
dataplex-types.global.schema:
  fields:
    - name: user_id
      dataType: STRING
      metadataType: STRING
      description: "Obfuscated unique identifier for the user."
    - name: agg_timestamp
      dataType: TIMESTAMP
      metadataType: DATETIME
      description: "The timestamp marking the end of the aggregation period."
    - name: request_count
      dataType: INT64
      metadataType: NUMBER
      description: "Total number of requests made by the user in the aggregation window."
    - name: error_count
      dataType: INT64
      metadataType: NUMBER
      description: "Number of requests that resulted in an error."
    - name: client_type
      dataType: STRING
      metadataType: STRING
      description: "The type of client used to make the requests (e.g., 'WEB', 'MOBILE')."
