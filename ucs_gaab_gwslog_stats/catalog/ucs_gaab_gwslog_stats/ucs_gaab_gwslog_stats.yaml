id: ucs_gaab_gwslog_stats
type: cloud-ml-metadata-test-jialu.us-central1.simple-entry-type
resource:
  name: projects/concord-prod/datasets/analysis_userlevel/tables/ucs_gaab_gwslog_stats
  displayName: "ucs_gaab_gwslog_stats"
  description: "Aggregated statistics for Google Web Server (GWS) logs at the user level."
dataplex-types.global.schema:
  fields:
    - name: user_id
      dataType: STRING
      metadataType: STRING
      description: "Obscured unique identifier for the user."
    - name: aggregation_timestamp
      dataType: TIMESTAMP
      metadataType: OTHER
      description: "The timestamp when the aggregation was performed."
    - name: request_count
      dataType: INTEGER
      metadataType: NUMBER
      description: "The number of requests made by the user."
    - name: error_count
      dataType: INTEGER
      metadataType: NUMBER
      description: "The number of requests that resulted in an error."
    - name: client_type
      dataType: STRING
      metadataType: STRING
      description: "The type of client used to make the requests (e.g., WEB, MOBILE)."
