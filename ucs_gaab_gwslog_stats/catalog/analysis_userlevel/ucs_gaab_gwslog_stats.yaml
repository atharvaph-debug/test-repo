id: ucs_gaab_gwslog_stats
type: cloud-ml-metadata-test-jialu.us-central1.simple-entry-type
resource:
  name: projects/concord-prod/datasets/analysis_userlevel/tables/ucs_gaab_gwslog_stats
  displayName: "ucs_gaab_gwslog_stats"
  description: "Aggregated statistics for Google Web Server (GWS) logs at the user level."
dataplex-types.global.schema:
  fields:
    - name: aggregation_timestamp
      dataType: TIMESTAMP
      metadataType: OTHER
      description: "The timestamp of the aggregation window. The table is partitioned on this field."
    - name: user_id
      dataType: STRING
      metadataType: STRING
      description: "The unique identifier for the user."
    - name: client_type
      dataType: STRING
      metadataType: STRING
      description: "The type of client making the requests (e.g., WEB, MOBILE)."
    - name: request_count
      dataType: INT64
      metadataType: NUMBER
      description: "The total number of requests made by the user in the aggregation window."
    - name: error_count
      dataType: INT64
      metadataType: NUMBER
      description: "The total number of requests that resulted in an error."
