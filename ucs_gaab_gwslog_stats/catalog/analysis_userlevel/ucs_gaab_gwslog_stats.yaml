id: ucs_gaab_gwslog_stats
type: cloud-ml-metadata-test-jialu.us-central1.simple-entry-type
resource:
  name: projects/concord-prod/datasets/analysis_userlevel/tables/ucs_gaab_gwslog_stats
  displayName: "ucs_gaab_gwslog_stats"
  description: "Aggregated statistics for Google Web Server (GWS) logs at the user level."
dataplex-types.global.schema:
  fields:
    - name: user_id
      dataType: STRING
      metadataType: STRING
      description: "Obscured unique identifier for the user."
    - name: aggregation_timestamp
      dataType: TIMESTAMP
      metadataType: OTHER
      description: "Timestamp of the aggregation window."
    - name: request_count
      dataType: INTEGER
      metadataType: NUMBER
      description: "Total number of requests from the user in the aggregation window."
    - name: error_count
      dataType: INTEGER
      metadataType: NUMBER
      description: "Total number of requests with errors from the user in the aggregation window."
    - name: partition_date
      dataType: DATE
      metadataType: OTHER
      description: "Date partition for the table, derived from the aggregation timestamp."
